name: Feature request
description: Suggest an idea or improvement
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like to see?
      placeholder: Briefly describe the feature and why it helps.
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Details / examples
      placeholder: Any UI/logic specifics, screenshots, or similar skins.
    validations:
      required: false