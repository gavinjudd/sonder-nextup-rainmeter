name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Validate repository and privacy rules
        shell: powershell
        run: .\Tests\validate_repo.ps1

      - name: Test offline multi-feed chronology
        shell: powershell
        run: .\Tests\test_fetcher.ps1

      - name: Smoke-test installer and backups
        shell: powershell
        run: .\Tests\test_installer.ps1

      - name: Build safe overlay archive
        shell: powershell
        run: .\Scripts\pack.ps1 -OutputPath "$env:RUNNER_TEMP\sonder-nextup-rainmeter.zip"

      - name: Upload validated package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sonder-nextup-rainmeter
          path: ${{ runner.temp }}\sonder-nextup-rainmeter.zip
          if-no-files-found: error
