[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1
BackgroundMode=2
SolidColor=0,0,0,1
MouseScrollUpAction=[!SetVariable Scale "(#Scale#+#ScrollStep#)"][!WriteKeyValue Variables Scale "(#Scale#+#ScrollStep#)"][!Refresh]
MouseScrollDownAction=[!SetVariable Scale "(#Scale#-#ScrollStep# < 0.2 ? 0.2 : #Scale#-#ScrollStep#)"][!WriteKeyValue Variables Scale "(#Scale#-#ScrollStep# < 0.2 ? 0.2 : #Scale#-#ScrollStep#)"][!Refresh]
ContextTitle=Use 12-hour time
ContextAction=[!WriteKeyValue Variables HourToken "#I"][!WriteKeyValue Variables PeriodHidden "0"][!Refresh]
ContextTitle2=Use 24-hour time
ContextAction2=[!WriteKeyValue Variables HourToken "H"][!WriteKeyValue Variables PeriodHidden "1"][!Refresh]

[Metadata]
Name=Sonder Next Up Clock
Author=Gavin Judd
Information=Independent editorial clock companion for the Sonder Next Up calendar.
License=MIT
Version=2.0.0

[Variables]
Scale=1
ScrollStep=0.05
HourToken=#I
PeriodHidden=0
PrimaryColor=255,255,255
AccentColor=35,201,235

[ClockTime]
Measure=Time
Format="%#HourToken#:%M"

[ClockPeriod]
Measure=Time
Format=%p

[ClockWeekday]
Measure=Time
Format=%A

[ClockDate]
Measure=Time
Format="%d  /  %B  /  %Y"

[Canvas]
Meter=Shape
X=0
Y=0
Shape=Rectangle 0,0,(300*#Scale#),(186*#Scale#) | Fill Color 0,0,0,1 | StrokeWidth 0
UpdateDivider=-1

[TimeDisplay]
Meter=String
MeasureName=ClockTime
StringAlign=Center
FontFace=Segoe UI Light
FontColor=#PrimaryColor#,238
FontSize=(38*#Scale#)
X=(150*#Scale#)
Y=(20*#Scale#)
Text=%1
InlinePattern=:
InlineSetting=Color | #PrimaryColor#,155
AntiAlias=1

[PeriodDisplay]
Meter=String
MeasureName=ClockPeriod
StringAlign=Left
StringCase=Upper
FontFace=Segoe UI
FontColor=#PrimaryColor#,145
FontSize=(7.5*#Scale#)
X=(222*#Scale#)
Y=(34*#Scale#)
Text=%1
AntiAlias=1
Hidden=#PeriodHidden#
DynamicVariables=1

[DividerLeft]
Meter=Shape
X=(81*#Scale#)
Y=(89*#Scale#)
Shape=Rectangle 0,0,(54*#Scale#),(1*#Scale#) | Fill Color #PrimaryColor#,46 | StrokeWidth 0
UpdateDivider=-1

[DividerAccent]
Meter=Shape
X=(141*#Scale#)
Y=(89*#Scale#)
Shape=Rectangle 0,0,(18*#Scale#),(1*#Scale#) | Fill Color #AccentColor#,220 | StrokeWidth 0
UpdateDivider=-1

[DividerRight]
Meter=Shape
X=(165*#Scale#)
Y=(89*#Scale#)
Shape=Rectangle 0,0,(54*#Scale#),(1*#Scale#) | Fill Color #PrimaryColor#,46 | StrokeWidth 0
UpdateDivider=-1

[WeekdayDisplay]
Meter=String
MeasureName=ClockWeekday
StringCase=Upper
StringAlign=Center
FontFace=Segoe UI Semibold
FontColor=#PrimaryColor#,220
FontSize=(13*#Scale#)
X=(150*#Scale#)
Y=(101*#Scale#)
Text=%1
AntiAlias=1

[DateDisplay]
Meter=String
MeasureName=ClockDate
StringCase=Upper
StringAlign=Center
FontFace=Segoe UI
FontColor=#PrimaryColor#,150
FontSize=(9*#Scale#)
X=(150*#Scale#)
Y=(137*#Scale#)
Text=%1
AntiAlias=1

[Bridge]
Meter=Shape
X=(133*#Scale#)
Y=(180*#Scale#)
Shape=Rectangle 0,0,(34*#Scale#),(1*#Scale#) | Fill Color #PrimaryColor#,58 | StrokeWidth 0
UpdateDivider=-1
