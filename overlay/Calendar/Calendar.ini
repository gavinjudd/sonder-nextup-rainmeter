; =================== GOOGLE CALENDAR EVENTS ===================

; PowerShell fetcher. RunCommand only launches when explicitly sent "Run".
[MeasureRunScript]
Measure=Plugin
Plugin=RunCommand
Program=%SystemRoot%\System32\WindowsPowerShell\v1.0\powershell.exe
Parameter=-NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "#@#gcal_fetch.ps1"
StartInFolder=#@#
State=Hide
OutputType=UTF8
Timeout=120000
UpdateDivider=-1
; WebParser is asynchronous. Reset its rate, force an update, then let its FinishAction repaint.
FinishAction=[!CommandMeasure MeasureGCalFile "Update"][!UpdateMeasure MeasureGCalFile]

; Trigger once when the skin loads, then every 5 minutes.
[MeasureFetchTimer]
Measure=Calc
Formula=Counter
UpdateDivider=5
OnUpdateAction=[!CommandMeasure MeasureRunScript "Run"]

; Parse up to 4 lines from UTF-16LE file
[MeasureGCalFile]
Measure=Plugin
Plugin=WebParser
URL=file://#@#gcal_events.txt
RegExp=(?m)^([^\r\n]*)(?:\r?\n([^\r\n]*))?(?:\r?\n([^\r\n]*))?(?:\r?\n([^\r\n]*))?
CodePage=1200
UpdateRate=1
UpdateDivider=-1
Flags=ForceReload | NoCacheWrite
FinishAction=[!HideMeterGroup GCalSurfaces][!ShowMeter MeterSurface1][!UpdateMeasure MeasureEvent1][!UpdateMeasure MeasureEvent2][!UpdateMeasure MeasureEvent3][!UpdateMeasure MeasureEvent4][!UpdateMeasureGroup GCalDerived][!UpdateMeasure MeasureHas1][!UpdateMeasure MeasureHas2][!UpdateMeasure MeasureHas3][!UpdateMeasure MeasureHas4][!UpdateMeterGroup GCalSurfaces][!UpdateMeterGroup GCalRows][!Redraw]

[MeasureEvent1]
Measure=Plugin
Plugin=WebParser
URL=[MeasureGCalFile]
StringIndex=1

[MeasureEvent2]
Measure=Plugin
Plugin=WebParser
URL=[MeasureGCalFile]
StringIndex=2

[MeasureEvent3]
Measure=Plugin
Plugin=WebParser
URL=[MeasureGCalFile]
StringIndex=3

[MeasureEvent4]
Measure=Plugin
Plugin=WebParser
URL=[MeasureGCalFile]
StringIndex=4

[MeasureEvent1Date]
Measure=String
Group=GCalDerived
String=[&MeasureEvent1]
RegExpSubstitute=1
Substitute="^([^\x{2022}]+?)\s*\x{2022}.*$":"\1"
DynamicVariables=1

[MeasureEvent1Time]
Measure=String
Group=GCalDerived
String=[&MeasureEvent1]
RegExpSubstitute=1
Substitute="^[^\x{2022}]+\x{2022}\s*([^\x{2022}]+?)\s*\x{2022}.*$":"\1"
DynamicVariables=1

[MeasureEvent1Title]
Measure=String
Group=GCalDerived
String=[&MeasureEvent1]
RegExpSubstitute=1
Substitute="^[^\x{2022}]+\x{2022}[^\x{2022}]+\x{2022}\s*(.*)$":"\1"
DynamicVariables=1

[MeasureEvent2Date]
Measure=String
Group=GCalDerived
String=[&MeasureEvent2]
RegExpSubstitute=1
Substitute="^([^\x{2022}]+?)\s*\x{2022}.*$":"\1"
DynamicVariables=1

[MeasureEvent2Time]
