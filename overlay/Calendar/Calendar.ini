[Rainmeter]
Update=60000
DynamicWindowSize=1
AccurateText=1
; Refresh immediately after the computer resumes; the timer handles skin load.
OnWakeAction=[!CommandMeasure MeasureRunScript "Run"]
MouseScrollUpAction=[!SetVariable Scale "(#Scale#+#ScrollMouseIncrement#)"][!WriteKeyValue Variables Scale "(#Scale#+#ScrollMouseIncrement#)"][!Refresh]
MouseScrollDownAction=[!SetVariable Scale "(#Scale#-#ScrollMouseIncrement# < 0.2 ? 0.2 : #Scale#-#ScrollMouseIncrement#)"][!WriteKeyValue Variables Scale "(#Scale#-#ScrollMouseIncrement# < 0.2 ? 0.2 : #Scale#-#ScrollMouseIncrement#)"][!Refresh]

[Metadata]
Name=Sonder Next Up Calendar
Author=Michael Purses / mpurses; Next Up modifications by Gavin Judd
Information=Sonder Calendar derivative with an automatic chronological ICS agenda; changes are documented in NOTICE.md.
License=Creative Commons Attribution-NonCommercial-ShareAlike 3.0 Unported
Version=2.0.0

[Variables]
Scale=1.35
ScrollMouseIncrement=0.05
Color1=255,255,255
Color3=35,201,235
Date="Sunday":"Sunday","Monday":"Monday","Tuesday":"Tuesday","Wednesday":"Wednesday","Thursday":"Thursday","Friday":"Friday","Saturday":"Saturday","January":"January","February":"February","March":"March","April":"April","May":"May","June":"June","July":"July","August":"August","September":"September","October":"October","November":"November","December":"December"
Sunday=Sun
Monday=Mon
Tuesday=Tue
Wednesday=Wed
Thursday=Thu
Friday=Fri
Saturday=Sat
CardWidth=230
CardHeight=245
ContentX=18
ContentWidth=194
EventRow2Y=232
EventRow3Y=263
EventRow4Y=294

;This >> "Sunday., Monday.,  Tuesday., and so on" << aligns the days vertically along each column that makes up the days of the week.This is adjusted.Please, don't change anything here.
;This refers to the numbers, not to text "Mon, Tue, Wed, and so on..".

Sunday.=(32*#Scale#)
Monday.=(60*#Scale#)
Tuesday.=(88*#Scale#)
Wednesday.=(115*#Scale#)
Thursday.=(142*#Scale#)
Friday.=(170*#Scale#)
Saturday.=(198*#Scale#)

;This >> "Week1., Week2., Week3., and so on" << aligns the days horizontally along each row.This is adjusted.Please, don't change anything here.

Week1.=(77*#Scale#)
Week2.=(94*#Scale#)
Week3.=(111*#Scale#)
Week4.=(128*#Scale#)
Week5.=(145*#Scale#)
Week6.=(162*#Scale#)

;This >> "ExtraDays" << means that you can "enable" or "disable" extra days on Calendar. 0 is to disable "ExtraDays", and 1 is to enable "ExtraDays".You can change this if you want, without worry. ;)

ExtraDays=1

;-------------------------------------------------------------
;-------------------------------------------------------------

[TextStyle]
stringAlign=Center
FontFace=Segoe UI
FontColor=#Color1#,225
FontSize=(6.25*#Scale#)
AntiAlias=1

[TextStyle2]
stringAlign=Center
FontFace=Segoe UI
FontColor=#Color1#,58
FontSize=(6.25*#Scale#)
AntiAlias=1

;-------------------------------------------------------------
;-------------------------------------------------------------

[CardSurfaceStyle]
X=0
Y=0
CardFill=90 | 22,23,25,238 ; 0 | 16,17,19,244 ; 0.55 | 12,13,15,248 ; 1
UpdateDivider=-1
AntiAlias=1

; Mutually exclusive full-height vector surfaces keep the gradient and outline
; continuous at every agenda height, with no stitched seams or cutoff.
[MeterSurface1]
Meter=Shape
MeterStyle=CardSurfaceStyle
Group=GCalSurfaces
Shape=Rectangle (0.5*#Scale#),(0.5*#Scale#),((#CardWidth#-1)*#Scale#),((245-1)*#Scale#),(3*#Scale#) | Fill LinearGradient CardFill | StrokeWidth (0.75*#Scale#) | Stroke Color #Color1#,16

[MeterSurface2]
Meter=Shape
MeterStyle=CardSurfaceStyle
Group=GCalSurfaces
Shape=Rectangle (0.5*#Scale#),(0.5*#Scale#),((#CardWidth#-1)*#Scale#),((276-1)*#Scale#),(3*#Scale#) | Fill LinearGradient CardFill | StrokeWidth (0.75*#Scale#) | Stroke Color #Color1#,16
Hidden=1

[MeterSurface3]
Meter=Shape
MeterStyle=CardSurfaceStyle
Group=GCalSurfaces
Shape=Rectangle (0.5*#Scale#),(0.5*#Scale#),((#CardWidth#-1)*#Scale#),((307-1)*#Scale#),(3*#Scale#) | Fill LinearGradient CardFill | StrokeWidth (0.75*#Scale#) | Stroke Color #Color1#,16
Hidden=1

[MeterSurface4]
Meter=Shape
MeterStyle=CardSurfaceStyle
Group=GCalSurfaces
Shape=Rectangle (0.5*#Scale#),(0.5*#Scale#),((#CardWidth#-1)*#Scale#),((338-1)*#Scale#),(3*#Scale#) | Fill LinearGradient CardFill | StrokeWidth (0.75*#Scale#) | Stroke Color #Color1#,16
Hidden=1

[MeterSurfaceTopKeyline]
Meter=Shape
X=(6*#Scale#)
Y=(0.5*#Scale#)
Shape=Rectangle 0,0,((#CardWidth#-12)*#Scale#),(0.75*#Scale#) | Fill LinearGradient SurfaceTopLight | StrokeWidth 0
SurfaceTopLight=0 | 255,255,255,28 ; 0 | 255,255,255,10 ; 0.62 | 255,255,255,0 ; 1
UpdateDivider=-1

[MeterBg2]
Meter=Shape
X=(#ContentX#*#Scale#)
Y=(69*#Scale#)
Shape=Rectangle 0,0,(#ContentWidth#*#Scale#),(0.5*#Scale#) | Fill Color #Color1#,14 | StrokeWidth 0
UpdateDivider=-1

[MeterDateDot]
Meter=Shape
X=([CalculateWeekDay2]-(4*#Scale#))
Y=([CalculateWeek]+(13*#Scale#))
Shape=Rectangle 0,0,(8*#Scale#),(1*#Scale#) | Fill Color #Color3#,235 | StrokeWidth 0
DynamicVariables=1

[MeterLine]
Meter=Shape
X=(#ContentX#*#Scale#)
Y=(44*#Scale#)
Shape=Rectangle 0,0,(18*#Scale#),(1*#Scale#) | Fill Color #Color1#,150 | StrokeWidth 0
Shape2=Rectangle (22*#Scale#),(0.25*#Scale#),(172*#Scale#),(0.5*#Scale#) | Fill Color #Color1#,26 | StrokeWidth 0
UpdateDivider=-1

[MeterEventsPanel]
Meter=Shape
Shape=Rectangle 0,0,1,1 | Fill Color 0,0,0,0 | StrokeWidth 0
UpdateDivider=-1
Hidden=1

[MeterLine2]
Meter=Shape
X=(#ContentX#*#Scale#)
Y=(193*#Scale#)
Shape=Rectangle 0,0,(18*#Scale#),(1*#Scale#) | Fill Color #Color1#,125 | StrokeWidth 0
Shape2=Rectangle (22*#Scale#),(0.25*#Scale#),(172*#Scale#),(0.5*#Scale#) | Fill Color #Color1#,22 | StrokeWidth 0
UpdateDivider=-1

[MeterEventsLabel]
Meter=String
Text=UP NEXT
StringCase=Upper
FontFace=Segoe UI
FontWeight=400
FontSize=(5.5*#Scale#)
FontColor=#Color1#,125
AntiAlias=1
X=(#ContentX#*#Scale#)
Y=(177*#Scale#)

[MeterRefresh]
Meter=String
FontFace=Segoe UI
FontWeight=400
FontSize=(4.75*#Scale#)
FontColor=#Color1#,78
StringAlign=Right
X=((#ContentX#+#ContentWidth#)*#Scale#)
Y=(178*#Scale#)
Text=SYNC
AntiAlias=1
ToolTipText=Refresh calendar now
LeftMouseUpAction=[!CommandMeasure MeasureRunScript "Run"]
MouseOverAction=[!SetOption MeterRefresh FontColor "#Color3#,230"][!UpdateMeter MeterRefresh][!Redraw]
MouseLeaveAction=[!SetOption MeterRefresh FontColor "#Color1#,78"][!UpdateMeter MeterRefresh][!Redraw]
MouseActionCursor=1

;-------------------------------------------------------------
;-------------------------------------------------------------

[MeasureYear]
Measure=Time
Format="%y"

[MeasureMonth]
Measure=time
Format="%#m"

[MeasureMonth2]
Measure=Time
Format="%B %Y"
Substitute=#Date#

[MeasureDay]
Measure=Time
Format="%#d"

[MeasureDay2]
Measure=Time
Format="%A"
Substitute="Monday":"#Monday#","Tuesday":"#Tuesday#","Wednesday":"#Wednesday#","Thursday":"#Thursday#","Friday":"#Friday#","Saturday":"#Saturday#","Sunday":"#Sunday#"

[MeasureDate]
Measure=Time
Format="%A  /  %#d"
Substitute=#Date#

[MeasureWeekDay]
Measure=Time
Format="%#w"

[MeasureCentury]
Measure=Calc
Formula=(20%4)

;-------------------------------------------------------------
;-------------------------------------------------------------

[CalculateMonthCode]
Measure=Calc
Formula=((MeasureMonth = 3) || (MeasureMonth = 11)) ? 3 : (((MeasureMonth = 4) || (MeasureMonth = 7)) ? 6 : ((MeasureMonth = 5) ? 1 : ((MeasureMonth = 6) ? 4 : ((MeasureMonth = 8) ? 2 : (((MeasureMonth = 9) || (MeasureMonth = 12)) ? 5 : ((MeasureMonth = 10) ? 0 : (CalculateLeapYear ? ((MeasureMonth = 1) ? 6 : 2) : ((MeasureMonth = 1) ? 0 : 3))))))))

[CalculateMonthStartDay]
Measure=Calc
Formula=(FLOOR((5*MeasureYear)/4)+CalculateMonthCode+1-(2*MeasureCentury))%7

[CalculateMonthStart]
Measure=Calc
Formula=(CalculateMonthStartDay = 0) ? 7 : CalculateMonthStartDay

[CalculateDayCount]
Measure=Calc
Formula=((MeasureMonth = 4) || (MeasureMonth = 6) || (MeasureMonth = 9) || (MeasureMonth = 11)) ? 30 : ((MeasureMonth = 2) ? (CalculateLeapYear ? 29 : 28) : 31)

[CalculateDayCount2]
Measure=Calc
Formula=((MeasureMonth-1 = 4) || (MeasureMonth-1 = 6) || (MeasureMonth-1 = 9) || (MeasureMonth-1 = 11)) ? 30 : ((MeasureMonth-1 = 2) ? (CalculateLeapYear ? 29 : 28) : 31)

[CalculateWeekNum]
Measure=Calc
Formula=7 - (CalculateMonthStart - 1)

[CalculateWeek]
Measure=Calc
Formula=MeasureDay <= CalculateWeekNum ? #Week1.# : ((MeasureDay > CalculateWeekNum) && (MeasureDay <= (CalculateWeekNum + 7)) ? #Week2.#  :((MeasureDay > (CalculateWeekNum +7)) && (MeasureDay <= (CalculateWeekNum + 14)) ? #Week3.# :((MeasureDay > (CalculateWeekNum +14)) && (MeasureDay <= (CalculateWeekNum + 21)) ? #Week4.# :((MeasureDay > (CalculateWeekNum +21)) && (MeasureDay <= (CalculateWeekNum + 28)) ? #Week5.# : #Week6.#))))

[CalculateWeekDay2]
Measure=Calc
Formula=MeasureWeekDay=0 ? #Sunday.# :(MeasureWeekDay=1 ? #Monday.# : (MeasureWeekDay=2 ? #Tuesday.# : (MeasureWeekDay=3 ? #Wednesday.# : (MeasureWeekDay=4 ? #Thursday.# : (MeasureWeekDay=5 ? #Friday.# : #Saturday.#)))))

[CalculateLeapYear]
Measure=Calc
Formula=((MeasureYear%4 = 0) && (MeasureYear%100 <> 0) || (MeasureYear%400 = 0))

