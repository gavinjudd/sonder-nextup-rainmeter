Group=GCalDerived
String=[&MeasureEvent2]
RegExpSubstitute=1
Substitute="^[^\x{2022}]+\x{2022}\s*([^\x{2022}]+?)\s*\x{2022}.*$":"\1"
DynamicVariables=1

[MeasureEvent2Title]
