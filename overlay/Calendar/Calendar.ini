Formula=2-FLOOR((5*MeasureYear)/4)-CalculateMonthCode+(2*MeasureCentury)-7*FLOOR((2-FLOOR((5*MeasureYear)/4)-CalculateMonthCode+(2*MeasureCentury))/7)

