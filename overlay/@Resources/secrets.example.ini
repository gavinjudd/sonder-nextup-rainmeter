# Copy this file to secrets.ini. Never commit secrets.ini.
# example.invalid is reserved for documentation and will not fetch a calendar.

# One or more private ICS feeds, separated by commas or semicolons.
ICS_URLS=https://example.invalid/primary-calendar.ics

# Alternative numbered form:
# ICS_URL=https://example.invalid/primary-calendar.ics
# ICS_URL2=https://example.invalid/secondary-calendar.ics

# Optional local-only filters. Use an exact event summary and local date.
# HIDE_SUMMARY_DAY=Example appointment|2026-01-15
# HIDE_SUMMARY_FROM=Example recurring event|2026-01-15
